services:
  - type: web
    name: neurovoice-api
    env: python
    rootDir: api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: PORT
        value: 8000
      - key: CORS_ORIGINS
        value: https://neurovoice-web.vercel.app,http://localhost:3000
      - key: DATABASE_NAME
        value: neurovoice
      - key: FIREBASE_PROJECT_ID
        value: neurovoice-3c2c7
      - key: GOOGLE_APPLICATION_CREDENTIALS
        value: service-account.json
